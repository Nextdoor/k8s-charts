{{- /*
DestinationRules for the Service(s) created by this chart, rendered by
nd-common.destinationRuleFor (see charts/nd-common/templates/_destinationrule.tpl).

One rule is rendered per Service this chart creates, with the same trafficPolicy:
the primary Service, the `-canary` Service (canary strategy without rolloutZones,
host-level routing only) and the `-preview` Service (blueGreen strategy). Subsets
are only attached to the primary Service's rule. When
`virtualService.subsetRouting.enabled` is set and no explicit
`destinationRule.subsets` are given, stable and canary subsets selecting this
chart's pods are generated; Argo Rollouts then manages the
`rollouts-pod-template-hash` label on each subset at runtime.
*/}}
{{- if and .Values.istio.enabled .Values.destinationRule.enabled }}
{{- $fullname := include "nd-common.fullname" . }}
{{- $serviceName := include "nd-common.serviceName" . }}
{{- $targets := list (dict "name" $fullname "host" $serviceName) }}
{{- if and (eq .Values.strategy "canary") (eq (len .Values.rolloutZones) 0) (or (not .Values.virtualService.subsetRouting.enabled) .Values.ingress.enabled) }}
{{- $targets = append $targets (dict "name" (printf "%s-canary" $fullname) "host" (printf "%s-canary" $serviceName)) }}
{{- end }}
{{- if eq .Values.strategy "blueGreen" }}
{{- $targets = append $targets (dict "name" (printf "%s-preview" $fullname) "host" (printf "%s-preview" $serviceName)) }}
{{- end }}
{{- $subsets := .Values.destinationRule.subsets }}
{{- if and (not $subsets) .Values.virtualService.enabled .Values.virtualService.subsetRouting.enabled }}
{{- $selector := include "nd-common.selectorLabels" . | fromYaml }}
{{- $subsets = list
      (dict "name" (default "stable" .Values.virtualService.subsetRouting.stableSubsetName) "labels" $selector)
      (dict "name" (default "canary" .Values.virtualService.subsetRouting.canarySubsetName) "labels" $selector) }}
{{- end }}
{{- range $target := $targets }}
{{- $s := list }}
{{- if eq $target.name $fullname }}{{ $s = $subsets }}{{ end }}
{{- include "nd-common.destinationRuleFor" (dict "root" $ "name" $target.name "host" $target.host "subsets" $s) }}
{{- end }}
{{- end }}
