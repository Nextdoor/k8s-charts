# Exercises istio.locality.enabled together with client self-discovery: the
# typical configuration for a workload that calls a zone-aware upstream.
readinessProbe:
  httpGet:
    path: /
    port: http

replicaCount: 2
minReadySeconds: 2
progressDeadlineSeconds: 90
terminationGracePeriodSeconds: 5

istio:
  locality:
    enabled: true
  proxyConfig:
    proxyMetadata:
      ISTIO_META_ENABLE_SELF_DISCOVERY: "true"
