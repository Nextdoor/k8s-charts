{{- /*
Optional DestinationRule for the Service created by this chart.

Istio only applies locality-aware routing to an upstream when a DestinationRule for
that host carries `outlierDetection`, and Istio 1.31's zone-aware load balancing is
configured through `trafficPolicy.loadBalancer.zoneAwareLbSetting` on the same
object. Rendering the rule from the chart lets a service opt in with values only.

Notes:
  - `zoneAwareLbSetting` and `localityLbSetting` are mutually exclusive in Istio
    (istiod rejects a rule that carries both), so rendering fails early when both
    are configured.
  - `zoneAwareLbSetting.enabled: false` makes istiod emit `routing_enabled: 0%`,
    which leaves traffic behaviour unchanged. The rule can therefore ship before
    client proxies have self-discovery, and the later flip to `true` is a single
    values change that takes effect on the next xDS push, without pod restarts.
*/}}
{{- if and .Values.istio.enabled .Values.destinationRule.enabled }}
{{- $dr := .Values.destinationRule }}
{{- $lb := deepCopy (default (dict) $dr.loadBalancer) }}
{{- if $dr.zoneAwareLb.configure }}
{{- if hasKey $lb "localityLbSetting" }}
{{- fail "destinationRule.loadBalancer.localityLbSetting cannot be combined with destinationRule.zoneAwareLb.configure=true: Istio accepts only one of localityLbSetting and zoneAwareLbSetting on a DestinationRule" }}
{{- end }}
{{- $za := dict "enabled" $dr.zoneAwareLb.enabled }}
{{- with $dr.zoneAwareLb.minClusterSize }}
{{- $_ := set $za "minClusterSize" . }}
{{- end }}
{{- with $dr.zoneAwareLb.failover }}
{{- $_ := set $za "failover" . }}
{{- end }}
{{- $_ := set $lb "zoneAwareLbSetting" $za }}
{{- end }}
{{- $hasPolicy := or $dr.connectionPool $dr.outlierDetection $lb $dr.tls }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ include "nd-common.fullname" . }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
  {{- with $dr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ include "nd-common.serviceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- if $hasPolicy }}
  trafficPolicy:
    {{- with $dr.connectionPool }}
    connectionPool:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $dr.outlierDetection }}
    outlierDetection:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $lb }}
    loadBalancer:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $dr.tls }}
    tls:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $dr.subsets }}
  subsets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
