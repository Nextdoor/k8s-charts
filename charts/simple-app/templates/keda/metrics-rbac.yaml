{{- /*
Lets the shared KEDA Datadog service account read external metrics in this
namespace only; the Datadog Cluster Agent authorizes each query against the
DatadogMetric's namespace. Rendered once per release, whatever the zone count.
*/}}
{{- if and .Values.autoscaling.enabled .Values.autoscaling.keda.enabled (eq (include "simple-app.kedaSharedAuth" .) "true") }}
{{- $auth := .Values.autoscaling.keda.sharedTriggerAuthentication }}
{{- $name := printf "%s-keda-external-metrics-reader" (include "nd-common.fullname" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
rules:
  - apiGroups: ["external.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ required "autoscaling.keda.sharedTriggerAuthentication.serviceAccountName is required" $auth.serviceAccountName }}
    namespace: {{ required "autoscaling.keda.sharedTriggerAuthentication.serviceAccountNamespace is required" $auth.serviceAccountNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
