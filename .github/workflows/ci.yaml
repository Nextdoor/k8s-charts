name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'

jobs:
  helm-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up helm-docs
        uses: envoy/install-helm-docs@v1.0.0
        with:
          version: 1.11.0

      - name: Run helm-docs
        run: helm-docs && git diff --exit-code

  promtool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.2

      - uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Install PyYAML
        run: pip install pyyaml

      # Runs `make promtool_test` for every chart that ships a `tests/`
      # directory. Charts without one are skipped, so this is a no-op until a
      # chart opts in by adding rule tests.
      - name: Run promtool rule tests
        run: |
          set -euo pipefail
          found=0
          for dir in charts/*/tests; do
            [ -d "$dir" ] || continue
            found=1
            make -C "$(dirname "$dir")" promtool_test
          done
          if [ "$found" = "0" ]; then
            echo "No charts ship rule tests; nothing to do."
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.2

      - uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct --config ct.yaml list-changed)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi
          if [[ "$changed" == *"rollout-app"* ]]; then
            echo "::set-output name=rollout::true"
          fi
          if [[ "$changed" == *"simple-workflow"* ]]; then
            echo "::set-output name=simple-workflow::true"
          fi

      - name: Run chart-testing (lint)
        run: ct --config ct.yaml lint

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Install Argo Rollouts Controller
        if: steps.list-changed.outputs.rollout == 'true'
        run: |
          make -C charts/rollout-app install_rollouts

      - name: Install Argo Workflow Controller
        if: steps.list-changed.outputs.simple-workflow == 'true'
        run: |
          make -C charts/simple-workflow install_argo_workflow

      - name: Install CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: make crds

      - name: Wait
        if: steps.list-changed.outputs.changed == 'true'
        run: sleep 1

      - name: Run chart-testing (install)
        run: ct --config ct.yaml install
